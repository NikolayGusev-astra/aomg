name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # Тесты — до сборки. Без этого шага зелёный статус сборки ничего
  # не говорил о коде: ни одного прогона тестов в CI не было.
  test:
    runs-on: windows-latest      # AOMG — Windows-only (ADR-0006)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run suite
        run: python -m pytest tests -q

  build:
    needs: test
    # ADR-0006: Windows-only. supervisor/tray/frozen-пути содержат
    # Windows-only предположения (CREATE_NO_WINDOW, панель задач, .exe),
    # поэтому Linux/macOS-артефакты были сборкой неработоспособного:
    # они собирались, скачивались и не запускались.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build AOMG (onedir)
        run: pyinstaller AOMG.spec --noconfirm --distpath dist --workpath build

      - name: Build mcp-proxy (onedir, own runtime dir)
        run: pyinstaller mcpproxy.spec --noconfirm --distpath dist --workpath build

      - name: Assemble bundle
        shell: bash
        run: |
          cp dist/mcp-proxy/mcp-proxy.exe dist/AOMG/
          cp -r dist/mcp-proxy/mcp_proxy_internal dist/AOMG/
          # example-конфиг едет в docs/, а не рядом с exe: первый запуск
          # сам создаёт чистый config.yaml с проверенным портом
          mkdir -p dist/AOMG/docs
          cp config.example.yaml dist/AOMG/docs/
          cd dist && tar -czf ../AOMG-windows.tar.gz AOMG/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AOMG-windows
          path: AOMG-windows.tar.gz

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AOMG-windows.tar.gz
          generate_release_notes: true
